---
satellite_version: "6.17"
# Supported RHEL majors per Satellite release -- verify against the Red Hat
# Satellite lifecycle page before using a new release and update as needed.
satellite_supported_rhel:
  "6.15": [8, 9]
  "6.16": [8, 9]
  "6.17": [9]
  "6.18": [9]
satellite_min_memory_mb: 19000      # Red Hat requires 20 GB (32 GB recommended)
satellite_min_cpus: 4

satellite_organization: Default Organization
satellite_location: Default Location
satellite_admin_username: admin
satellite_admin_password: "{{ vault_satellite_admin_password }}"
satellite_installer_extra_args: []
# e.g. ["--foreman-proxy-dns true", "--foreman-proxy-dhcp true"]

# Enable the Red Hat CDN repos needed to install Satellite. Requires the host
# to be registered to RHSM (registration_method: rhsm).
satellite_manage_repos: true

satellite_firewall_ports:
  - 80/tcp
  - 443/tcp
  - 5647/tcp
  - 8000/tcp
  - 8140/tcp
  - 9090/tcp

# Optional subscription manifest (path on the controller) uploaded after install.
satellite_manifest_file: ""

# Optional Red Hat repositories to enable and sync after the manifest upload.
satellite_repositories: []
# - product: Red Hat Enterprise Linux for x86_64
#   name: Red Hat Enterprise Linux 9 for x86_64 - BaseOS (RPMs)
#   releasever: "9"
satellite_sync_repositories: false
