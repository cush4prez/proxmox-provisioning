---
- name: Create admin user accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: wheel
    append: true
    shell: /bin/bash
  loop: "{{ admin_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install admin user SSH keys
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    key: "{{ item.1 }}"
  loop: "{{ admin_users | subelements('ssh_keys', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}"
