---
# Builds groups from each node's host_vars when the inventory loads, so they
# work with --limit, ansible-inventory --graph and group_vars/<group>.yml.
# (Named zz_* so it is parsed after hosts.yml.)
#   rhel8 / rhel9 / rhel10                          <- rhel_version
#   role_dns / role_ntp / role_satellite / role_aap <- server_roles
#   stig / nostig                                   <- stig_enabled
plugin: ansible.builtin.constructed
strict: true
use_vars_plugins: true
keyed_groups:
  - key: rhel_version | string
    prefix: rhel
    separator: ""
  - key: server_roles
    prefix: role
groups:
  stig: stig_enabled | bool
  nostig: not (stig_enabled | bool)
