---
# Every node managed by this project lives in the `rhel_nodes` group.
# What a node IS (RHEL version, DISA STIG or not, which server roles, VM size,
# IP address...) is defined per node in host_vars/<fqdn>.yml.
#
# zz_groups.yml builds these groups from the host_vars, so you can target them
# with --limit (e.g. --limit role_dns, --limit 'rhel9:&stig'):
#   rhel8 / rhel9 / rhel10                    -> from rhel_version
#   role_dns / role_ntp / role_satellite / role_aap  -> from server_roles
#   stig / nostig                              -> from stig_enabled
all:
  children:
    rhel_nodes:
      hosts:
        ns01.myhome.lab:
        ntp01.myhome.lab:
        sat01.myhome.lab:
        aap01.myhome.lab:
        util01.myhome.lab:

    # Filled automatically from host_vars by zz_groups.yml -- do not add hosts
    # here. Declared so playbooks for unused roles don't warn about empty groups.
    rhel8: {}
    rhel9: {}
    rhel10: {}
    role_dns: {}
    role_ntp: {}
    role_satellite: {}
    role_aap: {}
    stig: {}
    nostig: {}
